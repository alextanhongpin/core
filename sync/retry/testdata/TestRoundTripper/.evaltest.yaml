name: non-retryable
input: 401
evals:
  - name: no error
    expr: err == nil
---
name: ok
input: 200
evals:
  - name: no error
    expr: err == nil
---
name: retryable
input: 500
evals:
  - name: no error
    expr: err != nil
replacements:
  - pattern: "http://127.0.0.1:(\\d+)"
    replacement: "http://127.0.0.1:8080"
