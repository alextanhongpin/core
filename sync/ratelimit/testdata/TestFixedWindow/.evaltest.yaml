# FixedWindow test cases
---

name: valid allow
input:
  limit: 5
  period: 1s
  burst: 0
  key: user1
  action: Allow
evals:
   - name: allowed
     expr: output.Allow == true
   - name: remaining
     expr: output.Remaining == 4
---
name: limit exceeded
input:
  limit: 2
  period: 1s
  burst: 0
  key: user1
  action: Allow
evals:
   - name: allowed
     expr: output.Allow == true
   - name: remaining after first
     expr: output.Remaining == 1
---
name: allow n
input:
  limit: 5
  period: 1s
  burst: 0
  key: user1
  action: AllowN
  n: 3
evals:
   - name: allowed
     expr: output.Allow == true
   - name: remaining after n
     expr: output.Remaining == 2
---
name: limit n
input:
  limit: 5
  period: 1s
  burst: 0
  key: user1
  action: LimitN
  n: 3
evals:
   - name: allowed
     expr: output.Allow == true
   - name: remaining
     expr: output.Remaining == 2
---
name: reset after period
input:
  limit: 1
  period: 1s
  burst: 0
  key: user1
  action: Allow
evals:
   - name: first request allowed
     expr: output.Allow == true
   - name: wait and allow again
     expr: true
