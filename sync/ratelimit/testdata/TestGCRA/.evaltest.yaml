# GCRA test cases
---

name: valid allow
input:
  limit: 5
  period: 1s
  burst: 0
  key: user1
  action: Allow
evals:
   - name: allowed
     expr: output.Allow == true
---
name: limit exceeded
input:
  limit: 2
  period: 1s
  burst: 0
  key: user1
  action: Allow
evals:
   - name: allowed
     expr: output.Allow == true
---
name: burst allow
input:
  limit: 2
  period: 1s
  burst: 2
  key: user1
  action: Allow
evals:
   - name: allowed
     expr: output.Allow == true
   - name: remaining after burst
     expr: output.Remaining == 2