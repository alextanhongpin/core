---
cases:
  - name: Capacity exceeded
    config:
      Limit: 1
      BacklogLimit: 0
      BacklogTimeout: 10ms
    calls: 2
    expectedError: "throttle: capacity exceeded"

  - name: Successful call within limit
    config:
      Limit: 3
      BacklogLimit: 2
      BacklogTimeout: 10ms
    calls: 1
    expectedError: null

  - name: Backlog exhaustion
    config:
      Limit: 1
      BacklogLimit: 1
      BacklogTimeout: 10ms
    calls: 3
    expectedError: "throttle: capacity exceeded"

  - name: Context timeout
    config:
      Limit: 1
      BacklogLimit: 1
      BacklogTimeout: 10ms
    calls: 1
    ctxTimeout: 1ms
    expectedError: "throttle: timeout"
