name: closed error
description: |
  circuit will be opened due to error threshold exceeded
input:
  status: closed
  n: 4
evals:
  - name: status opened
    expr: output == "opened"
---
name: opened error sleep
description: |
  circuit will be opened first, then it will be half-open, and
  eventually closed
input:
  status: opened
  n: 4
evals:
  - name: status opened
    expr: output == "closed"
---
name: opened error
